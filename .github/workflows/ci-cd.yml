name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-docker:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Set up Java 17
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # 3️⃣ Build Spring Boot executable JAR
      - name: Build JAR
        run: ./mvnw clean package spring-boot:repackage

      # Log in to AWS ECR
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to AWS ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REPOSITORY }}

      # 4️⃣ Log in to Docker Hub -- no need to deploy in docker hub if using aws or gcp
#      - name: Log in to Docker Hub
#        uses: docker/login-action@v2
#        with:
#          username: ${{ secrets.DOCKER_USERNAME }}
#          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5️⃣ Build Docker image
      - name: Build Docker image
        run: docker build -t quoteapi:latest .

      # 6️⃣ Tag Docker image for Docker Hub
#      - name: Tag Docker image
#        run: docker tag quoteapi:latest ${{ secrets.DOCKER_USERNAME }}/quoteapi:latest

      - name: Tag Docker image for ECR
        run: docker tag quoteapi:latest ${{ secrets.ECR_REPOSITORY }}:latest

      # 7️⃣ Push Docker image to Docker Hub
#      - name: Push Docker image
#        run: docker push ${{ secrets.DOCKER_USERNAME }}/quoteapi:latest

      - name: Deploy to AWS App Runner
        run: |
          aws apprunner create-service \
            --service-name quoteapi-service \
            --source-configuration '{
                "ImageRepository": {
                "ImageIdentifier": "${{ secrets.ECR_REPOSITORY }}:latest",
                "ImageRepositoryType": "ECR"
                }
              }' \
            --instance-configuration Cpu=1024,Memory=2048
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
