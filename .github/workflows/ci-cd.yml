name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-and-docker:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 2: Configure AWS credentials (THIS WAS MISSING)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Step 3 — Login to ECR (now it works)
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 3️⃣ Build Spring Boot executable JAR
      - name: Build JAR
        run: ./mvnw clean package spring-boot:repackage

      # 3️⃣ Build Docker image
      - name: Build Docker image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest .

      # Step 4: Push Docker image to ECR
      - name: Push Docker image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest


      # Step 5: Deploy to AWS App Runner
      - name: Deploy to AWS App Runner
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPO: ${{ secrets.ECR_REPOSITORY }}
          SERVICE_NAME: quoteapi-service
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPO:latest
          echo "Using image: $IMAGE_URI"
          
          # Check if App Runner service already exists
          SERVICE_EXISTS=$(aws apprunner list-services --region $AWS_REGION \
            --query "ServiceSummaryList[?ServiceName=='$SERVICE_NAME'].ServiceName" \
            --output text)
            
          if [ -z "$SERVICE_EXISTS" ]; then
            echo "Creating App Runner service..."
            aws apprunner create-service \
              --service-name $SERVICE_NAME \
              --source-configuration "{
                \"ImageRepository\": {
                \"ImageIdentifier\": \"$IMAGE_URI\",
                \"ImageRepositoryType\": \"ECR\",
                \"ImageConfiguration\": { \"Port\": \"8080\" }
                }
              }" \
              --instance-configuration Cpu=1024,Memory=2048
          else
            echo "Updating existing App Runner service..."
            SERVICE_ARN=$(aws apprunner list-services --region $AWS_REGION \
              --query "ServiceSummaryList[?ServiceName=='$SERVICE_NAME'].ServiceArn" \
              --output text)
          
            aws apprunner update-service \
              --service-arn $SERVICE_ARN \
              --source-configuration "{
                \"ImageRepository\": {
                \"ImageIdentifier\": \"$IMAGE_URI\",
                \"ImageRepositoryType\": \"ECR\",
                \"ImageConfiguration\": { \"Port\": \"8080\" }
                }
              }" \
              --instance-configuration Cpu=1024,Memory=2048
          fi
